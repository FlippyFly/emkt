<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <table width="600" cellspacing="0" cellpadding="0">
            <thead>
                <tr bgcolor="#1C54">
                    <th style="padding-right: 40px; padding-top: 24px; padding-bottom: 24px; padding-left: 40px;">
                        <img src="./imagens/xbox_logo.png" alt="Xbox logo">
                    </th>
                </tr>
            </thead>
            <tbody">
                <tr>
                    <td colspan="2" style="padding: 24px 40px 40px 40px;">
                        <h2 style="font-family: sans-serif; font-size: 16px; font-style: italic;">
                            Olá, tudo bem?
                        </h2>
                        <p style="font-family: sans-serif; font-size: 16px; padding-bottom: 24px;">
                            Segue os novos jogos que estão disponiveis no nosso serviço de streaming:
                        </p>
                        <div align="center">
                            <a style="text-decoration: none;" href="">
                                <img width="240" height="360" src="./imagens/assassins_creed.png" alt="Assassin's Creed">
                                <p style="font-family: sans-serif; font-weight: bold;">
                                    Assassin's Creed
                                </p>
                            </a>
                        </div>
                        <div align="center" style="padding-top: 40px;">
                            <a style="text-decoration: none;" href="">
                                <img width="240" height="360" src="./imagens/battlefield.png" alt="Battlefield">
                                <p style="font-family: sans-serif; font-weight: bold;">
                                    Battlefield
                                </p>
                            </a>
                        </div>
                        <div align="center" style="padding-top: 40px;">
                            <a style="text-decoration: none;" href="">
                                <img width="240" height="360" src="./imagens/counter_strike.png" alt="Counter Strike">
                                <p style="font-family: sans-serif; font-weight: bold;">
                                    Counter Strike
                                </p>
                            </a>
                        </div>
                        <p style="padding-top: 16px; font-size: 14px; font-family: sans-serif; text-align: center;">
                            <i>
                                Caso não queria receber mais e-mails como esse 
                                <b>
                                    <a style="text-decoration: none; color: #000;" href="">Clique aqui.</a>
                                </b>
                            </i>
                        </p>
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr style="background: #1C54; ">
                    <td colspan="2" align="center" style="padding: 24px 200px 24px 200px;">
                        <a href="">
                            <img src="./imagens/xbox_button.png" alt="xbox.com.br">
                        </a>
                    </td>
                </tr>
            </tfoot>
        </table>
    </center>
